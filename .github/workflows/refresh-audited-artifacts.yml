name: refresh-audited-artifacts

on:
  push:

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-audited-artifacts]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis]"

      - name: Regenerate tracking comparison figure
        run: |
          python - <<'PY'
          import pandas as pd
          from benchmark.plotting import fig_tracking_comparison, style

          style()
          summary = pd.read_csv("results/tracking_controlled.csv")
          fig_tracking_comparison(summary)
          PY

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk biber \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-lang-german

      - name: Compile paper
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mv -f main.pdf Person_Detection.pdf

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/fig_tracking_comparison.png \
                  figures/fig_tracking_comparison.pdf \
                  figures/fig_tracking_comparison.svg \
                  paper/Person_Detection.pdf
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Refresh audited figures and paper [skip ci]"
            git pull --rebase origin main
            git push
          fi
