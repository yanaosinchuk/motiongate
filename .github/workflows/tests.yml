name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"

      - name: Compile-check Python sources
        run: python -m compileall -q src tests benchmark

      - name: Lint
        run: ruff check src tests benchmark

      - name: Import benchmark pipeline
        run: |
          python -m benchmark.run --help > /dev/null
          python -m benchmark.tracking_run --help > /dev/null

      - name: Run tests
        run: pytest -q
