name: Tracking benchmark

on:
  push:
    branches:
      - benchmark/tracking-evaluation
    paths:
      - ".github/workflows/tracking-benchmark.yml"
      - "src/motiongate/scheduler.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-tracking-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: benchmark/tracking-evaluation

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[benchmark]"

      - name: Download segmentation weights
        run: |
          mkdir -p weights
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO

          YOLO("yolov8n-seg.pt")
          source = Path("yolov8n-seg.pt")
          target = Path("weights/yolov8n-seg.pt")
          if source.exists():
              source.replace(target)
          elif not target.exists():
              raise SystemExit("Ultralytics did not leave yolov8n-seg.pt in an expected location")
          PY

      - name: Run controlled tracking benchmark
        run: python -m benchmark.tracking_study

      - name: Show summary
        run: |
          cat results/tracking_summary.json
          echo
          cat results/tracking_deltas.csv

      - name: Commit generated benchmark results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tracking_controlled.csv                   results/tracking_scenarios.csv                   results/tracking_deltas.csv                   results/tracking_summary.json                   figures/fig_tracking_extension.png                   figures/fig_tracking_extension.pdf
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
          else
            git commit -m "Refresh controlled optical-flow benchmark results"
            git push
          fi
