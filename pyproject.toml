[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motiongate"
version = "1.0.0"
description = "Motion-gated person detection for static-camera video (frame differencing + YOLOv8)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Yana Osinchuk" }]
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3", "torch>=2.1"]
analysis = ["pandas>=2.0", "matplotlib>=3.8"]
benchmark = ["ultralytics>=8.3", "torch>=2.1", "pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
motiongate = "motiongate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motiongate = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
